<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Liftlog · Steven Yoon</title>
  <meta name="description" content="A free, data-driven workout planner: generate a split, log sets, get progression suggestions, and see weekly volume per muscle, e1RM trends and PRs. Runs in your browser.">
  <meta name="theme-color" content="#b8382c">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../site.css">
  <link rel="stylesheet" href="app.css">
  <script src="../site.js" defer></script>
  <script src="core.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body class="lift">
  <header class="nav">
    <div class="wrap">
      <a class="name" href="../"><i aria-hidden="true"></i>Steven Yoon</a>
      <nav class="links" aria-label="Site"><a href="../#work">Work</a><a href="../#tools">Tools</a></nav>
      <a class="app-pill" href="https://syoon291.github.io/nihongo/" title="Nihongo Ears: my Japanese speaking and listening app"><span aria-hidden="true">🗣️</span>Nihongo app</a>
      <button class="theme-btn" type="button" aria-label="Switch light or dark theme" data-theme-toggle>
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="wrap">
    <section class="hero" style="padding:44px 0 20px">
      <p class="eyebrow">Tool</p>
      <h1 class="display" style="font-size:clamp(40px,8vw,60px)">Lift<em>log</em></h1>
      <p class="lede" style="margin-top:14px">Plan a split, log your sets, and let the data tell you when to add weight. Everything stays in this browser.</p>
    </section>

    <nav class="tabs" role="tablist" aria-label="Liftlog">
      <button role="tab" data-tab="plan">Plan</button>
      <button role="tab" data-tab="train">Train</button>
      <button role="tab" data-tab="insights">Insights</button>
      <button role="tab" data-tab="data">Data</button>
    </nav>

    <div id="view" aria-live="polite"></div>
  </main>

  <div class="timer" id="timer" hidden>
    <div class="timer-bar"><i id="timer-fill"></i></div>
    <div class="timer-row">
      <span>Rest <b id="timer-left">0:00</b></span>
      <button type="button" class="btn" data-act="timer-add">+30s</button>
      <button type="button" class="btn" data-act="timer-stop">Skip</button>
    </div>
  </div>

  <footer><div class="wrap"><span>© <span data-year>2026</span> Steven Yoon</span><a href="legacy/">The 2023 version</a><a href="../">← Back to the site</a></div></footer>
</body>
</html>
