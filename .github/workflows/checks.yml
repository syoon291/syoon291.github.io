name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  no-remote-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No page loads a remote script
        run: python3 .github/scripts/check_no_remote_scripts.py
